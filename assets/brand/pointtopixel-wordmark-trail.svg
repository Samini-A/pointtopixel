<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 190" role="img" aria-labelledby="title desc">
  <title id="title">Point to Pixel</title>
  <desc id="desc">POINT and PIXEL joined by red marks that grow in length, followed by an arrow. TO is centered above the trail.</desc>
  <g fill="#f7f7f5" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="122" font-weight="900" letter-spacing="5">
    <text x="16" y="139">POINT</text>
    <text x="663" y="139">PIXEL</text>
  </g>
  <g fill="#ef233c">
    <rect x="452" y="90.5" width="7" height="7" rx="3.5" opacity=".42"/>
    <rect x="469" y="90.5" width="12" height="7" rx="3.5" opacity=".60"/>
    <rect x="491" y="90.5" width="18" height="7" rx="3.5" opacity=".78"/>
    <rect x="519" y="90.5" width="25" height="7" rx="3.5" opacity=".96"/>
  </g>
  <g fill="none" stroke="#ef233c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
