    <path d="M610 80L627 94L610 108"/>
  </g>
  <text x="541" y="73" text-anchor="middle" fill="#ef233c" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="4.5">TO</text>
</svg>
